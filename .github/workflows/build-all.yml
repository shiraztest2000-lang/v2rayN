name: release Windows x64 and x86 only

on:
  push:
    paths:
      - 'v2rayN/Directory.Build.props'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version. Defaults to the project version.'
        required: false
        default: 'auto'
        type: string

permissions:
  actions: read
  contents: write

jobs:
  validate-release:
    name: Resolve and validate release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release version
        id: validate
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          project_version="$(sed -nE 's#^[[:space:]]*<Version>([^<]+)</Version>[[:space:]]*$#\1#p' v2rayN/Directory.Build.props | head -n1)"
          input_tag="${INPUT_TAG:-auto}"
          input_tag="${input_tag#v}"
          [[ -n "$project_version" ]] || { echo "Project version not found" >&2; exit 1; }
          [[ "$input_tag" == "auto" || -z "$input_tag" ]] && input_tag="$project_version"
          [[ "$input_tag" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || { echo "Invalid release tag: $input_tag" >&2; exit 1; }
          [[ "$input_tag" == "$project_version" ]] || { echo "Tag $input_tag does not match project version $project_version" >&2; exit 1; }
          echo "release_tag=$input_tag" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create release without touching older releases or tags
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its current assets untouched."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "SHZv2rayN $RELEASE_TAG" \
              --notes "Windows x64 and x86 release." \
              --prerelease
          fi

  windows-x64:
    name: Build Windows x64 WPF
    needs: [validate-release, create-release]
    uses: ./.github/workflows/build-windows.yml
    with:
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  windows-x86:
    name: Build Windows x86 WPF
    needs: [validate-release, create-release]
    uses: ./.github/workflows/build-windows-x86.yml
    with:
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  verify-release-assets:
    name: Verify release contains only Windows x64 and x86 packages
    needs: [validate-release, windows-x64, windows-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Assert exact release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(",")')"
          expected="SHZv2rayN-${RELEASE_TAG}-windows-64.zip,SHZv2rayN-${RELEASE_TAG}-windows-86.zip"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release assets."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "Release contains exactly the Windows x64 and x86 ZIP packages."

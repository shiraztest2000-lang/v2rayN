name: release Windows x64 and x86 only

on:
  push:
    branches:
      - master
    paths:
      - 'v2rayN/Directory.Build.props'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Use auto to increment the final three digits from the latest published release, or enter a version manually.'
        required: false
        default: 'auto'
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: shzv2rayn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup-invalid-loop-releases:
    name: Remove accidental releases, tags, and workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags created by the previous trigger loop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for number in $(seq 10 20); do
            tag="7.25.6.$(printf '%03d' "$number")"
            if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
              echo "Deleting accidental release and tag $tag"
              gh release delete "$tag" --repo "$REPOSITORY" --cleanup-tag --yes
            else
              echo "No release found for $tag; checking for a leftover tag."
              gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
          done

      - name: Delete workflow run records created by the accidental tag loop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          run_ids="$(gh run list --repo "$REPOSITORY" --limit 1000 --json databaseId,headBranch \
            --jq '.[] | select(.headBranch | test("^7\\.25\\.6\\.(009|01[0-9]|020)$")) | .databaseId')"
          if [[ -z "$run_ids" ]]; then
            echo "No accidental workflow runs remain."
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "Deleting accidental workflow run $run_id"
            gh run delete "$run_id" --repo "$REPOSITORY" || echo "Could not delete run $run_id; continuing."
          done <<< "$run_ids"

  validate-release:
    needs: cleanup-invalid-loop-releases
    name: Resolve and validate release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release version
        id: validate
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          project_version="$(sed -nE 's#^[[:space:]]*<Version>([^<]+)</Version>[[:space:]]*$#\1#p' v2rayN/Directory.Build.props | head -n1)"
          [[ "$project_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]{3})$ ]] || {
            echo "Project version must have the form major.minor.patch.NNN; found: $project_version" >&2
            exit 1
          }
          base_version="${BASH_REMATCH[1]}"
          current_suffix="${BASH_REMATCH[2]}"
          input_tag="${INPUT_TAG:-auto}"
          input_tag="${input_tag#v}"

          if [[ "$input_tag" == "auto" || -z "$input_tag" ]]; then
            latest_suffix="$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
              awk -v prefix="$base_version." 'index($0,prefix)==1 {
                suffix=substr($0,length(prefix)+1)
                if (suffix ~ /^[0-9]{3}$/ && suffix+0 > max) max=suffix+0
              } END { if (max > 0) printf "%03d", max; else print "000" }')"
            current_num=$((10#$current_suffix))
            latest_num=$((10#$latest_suffix))
            if (( current_num > latest_num )); then next_num=$current_num; else next_num=$((latest_num + 1)); fi
            (( next_num <= 999 )) || { echo "Three-digit release counter exhausted for $base_version" >&2; exit 1; }
            input_tag="$(printf '%s.%03d' "$base_version" "$next_num")"
          else
            [[ "$input_tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]{3})$ ]] || {
              echo "Manual release tag must have the form major.minor.patch.NNN" >&2
              exit 1
            }
            [[ "${BASH_REMATCH[1]}" == "$base_version" ]] || {
              echo "Manual release tag must use project base version $base_version" >&2
              exit 1
            }
          fi
          echo "Selected release version: $input_tag"
          echo "release_tag=$input_tag" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create release without touching older releases or tags
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Create tag and release if missing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its current assets untouched."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "SHZv2rayN $RELEASE_TAG" \
              --notes "Windows x64 and x86 release." \
              --prerelease
          fi

  windows-x64:
    name: Build Windows x64 WPF
    needs: [validate-release, create-release]
    uses: ./.github/workflows/build-windows.yml
    with:
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  windows-x86:
    name: Build Windows x86 WPF
    needs: [validate-release, create-release]
    uses: ./.github/workflows/build-windows-x86.yml
    with:
      release_tag: ${{ needs.validate-release.outputs.release_tag }}

  verify-release-assets:
    name: Verify release contains only Windows x64 and x86 packages
    needs: [validate-release, windows-x64, windows-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Assert exact release asset set
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(",")')"
          expected="SHZv2rayN-${RELEASE_TAG}-windows-64.zip,SHZv2rayN-${RELEASE_TAG}-windows-86.zip"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release assets."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "Release contains exactly the Windows x64 and x86 ZIP packages."

name: release all platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact numeric version from v2rayN/Directory.Build.props (for example 7.25.6 or 7.25.6.001; do not add v).'
        required: false
        type: string

permissions: 
  actions: write
  contents: write

jobs:
  validate-release:
    name: Validate release tag and project version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No release tag supplied; this is a build-only run."
            exit 0
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Use three or four numeric components, e.g. 7.25.6 or 7.25.6.001 (without a leading v)." >&2
            exit 1
          fi
          project_version="$(sed -nE 's#^[[:space:]]*<Version>([^<]+)</Version>[[:space:]]*$#\1#p' v2rayN/Directory.Build.props | head -n1)"
          if [[ -z "$project_version" ]]; then
            echo "Could not read Version from v2rayN/Directory.Build.props" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$project_version" ]]; then
            echo "Release tag ($RELEASE_TAG) does not match project version ($project_version)." >&2
            echo "Update v2rayN/Directory.Build.props before creating a release." >&2
            exit 1
          fi
          echo "Validated release tag: $RELEASE_TAG"

  public-key:
    needs: validate-release
    if: inputs.release_tag != ''
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  release-WebAPI:
    needs: validate-release
    if: inputs.release_tag != ''
    uses: ./.github/workflows/release-WebAPI.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  update:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:

      - name: Trigger build windows
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-windows.yml/dispatches \
            -d "{
              \"ref\": \"master\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"

      - name: Trigger build linux
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-linux.yml/dispatches \
            -d "{
              \"ref\": \"master\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"

      - name: Trigger build osx
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-osx.yml/dispatches \
            -d "{
              \"ref\": \"master\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"

      - name: Trigger build windows desktop
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-windows-desktop.yml/dispatches \
            -d "{
              \"ref\": \"master\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"
            
      - name: Trigger build windows x86
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-windows-x86.yml/dispatches \
            -d "{
              \"ref\": \"master\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"

name: package and release Zip

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target: # windows linux macos windows-desktop
        required: true
        type: string
      isAot:
        required: false
        type: boolean
        default: false
      architectures:
        required: false
        type: string
        default: '["x64","arm64"]'
      sign:
        required: false
        type: boolean
        default: true
    secrets:
      GPG_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  actions: read

jobs:
  package:
    name: package x64 arm64
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: ubuntu-latest
    env:
      Target: |- 
        ${{
          case(
            inputs.target == 'windows-desktop', 'windows',
            inputs.target
          )
        }}
      Arch: |-
        ${{
          case(
            matrix.arch == 'x64', '64',
            matrix.arch
          ) 
        }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set package variables
      id: package-vars
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_IS_AOT: ${{ inputs.isAot }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        package_dir="SHZv2rayN-${RELEASE_TAG}"
        package_file="SHZv2rayN-${RELEASE_TAG}-${Target}-${Arch}.zip"
        build_artifact_name="${{ matrix.arch }}"
        rename_suffix=""
        if [[ "$INPUT_IS_AOT" == "true" ]]; then
          build_artifact_name="${build_artifact_name}-aot"
          rename_suffix="-aot"
        fi
        if [[ "$INPUT_TARGET" == "windows-desktop" ]]; then
          rename_suffix="-desktop${rename_suffix}"
        fi
        final_package_file="${package_file%.zip}${rename_suffix}.zip"

        {
          echo "build_artifact_name=${build_artifact_name}"
          echo "package_dir=${package_dir}"
          echo "package_file=${package_file}"
          echo "final_package_file=${final_package_file}"
          echo "rename_suffix=${rename_suffix}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.package-vars.outputs.build_artifact_name }}
        path: ${{ steps.package-vars.outputs.package_dir }}

    - name: Download and merge v2rayN core files
      shell: bash
      run: |
        set -euo pipefail
        core_archive="core-bin.zip"
        core_extract="core-bin-extracted"
        core_folder="v2rayN-$Target-$Arch"
        wget -nv -O "$core_archive" "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/$core_folder.zip"
        mkdir -p "$core_extract"
        7z x "$core_archive" "-o$core_extract" -y
        core_root="$core_extract/$core_folder"
        if [[ ! -d "$core_root/bin" ]]; then
          echo "Expected core directory or bin folder is missing: $core_root/bin" >&2
          find "$core_extract" -maxdepth 3 -type d -print
          exit 1
        fi
        # Merge the contents of the legacy core folder into the branded
        # package root. This keeps bin/ beside the application executable.
        cp -a "$core_root/." "${{ steps.package-vars.outputs.package_dir }}/"
        rm -rf "$core_archive" "$core_extract"

    - name: Package and validate zip archive layout
      shell: bash
      env:
        PACKAGE_DIR: ${{ steps.package-vars.outputs.package_dir }}
        PACKAGE_FILE: ${{ steps.package-vars.outputs.package_file }}
      run: |
        set -euo pipefail
        7z a -tZip "$PACKAGE_FILE" "$PACKAGE_DIR" -mx1
        python - "$PACKAGE_FILE" "$PACKAGE_DIR" <<'PY'
        import re
        import sys
        import zipfile

        archive_path, package_dir = sys.argv[1:]
        prefix = package_dir.rstrip("/") + "/"
        with zipfile.ZipFile(archive_path) as archive:
            names = [name for name in archive.namelist() if name and not name.endswith("/")]
        if not names:
            raise SystemExit("Package archive is empty.")
        outside = [name for name in names if not name.startswith(prefix)]
        if outside:
            raise SystemExit("Unexpected top-level content outside branded folder: " + ", ".join(outside[:10]))
        if not any(name.startswith(prefix + "bin/") for name in names):
            raise SystemExit("Expected bin/ directly inside the branded package folder.")
        legacy = [name for name in names if re.search(r"(^|/)v2rayN-windows-(64|86)/", name)]
        if legacy:
            raise SystemExit("Legacy wrapper folder found in ZIP: " + ", ".join(legacy[:10]))
        print(f"Validated {len(names)} files under {package_dir}/ with bin/ at package root.")
        PY

    - name: Rename package archive
      if: steps.package-vars.outputs.rename_suffix != ''
      shell: bash
      run: |
        mv "${{ steps.package-vars.outputs.package_file }}" \
          "${{ steps.package-vars.outputs.final_package_file }}"

    - name: Upload zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.target }}-${{ matrix.arch }}${{ inputs.isAot && '-aot' || '' }}
        path: ${{ steps.package-vars.outputs.final_package_file }}
        if-no-files-found: error

  release:
    name: sign and upload zip x64 arm64
    needs: package
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-${{ inputs.target }}-${{ matrix.arch }}${{ inputs.isAot && '-aot' || '' }}
      file_pattern: '*.zip'
      sign: ${{ inputs.sign }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

name: release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/package-zip.yml'
      - '.github/workflows/upload-sign.yml'
      - 'v2rayN/**'
      - 'global.json'
      - '.gitmodules'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      project: ./v2rayN/v2rayN.csproj

  release-zip:
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

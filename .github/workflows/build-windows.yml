name: release Windows x64

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      project: ./v2rayN/v2rayN.csproj
      version: ${{ inputs.release_tag }}
      architectures: '["x64"]'

  release-zip:
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows
      release_tag: ${{ inputs.release_tag }}
      architectures: '["x64"]'
      sign: false

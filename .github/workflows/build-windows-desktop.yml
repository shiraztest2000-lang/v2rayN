name: release Windows desktop (Avalonia UI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-windows-desktop.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/package-zip.yml'
      - '.github/workflows/upload-sign.yml'
      - 'v2rayN/**'
      - '!v2rayN/ServiceLib/Handler/SysProxy/ProxySettingLinux.cs'
      - '!v2rayN/ServiceLib/Sample/*linux*'
      - '!v2rayN/ServiceLib/Handler/SysProxy/ProxySettingOSX.cs'
      - '!v2rayN/ServiceLib/Sample/*osx*'
      - '!package-osx.sh'
      - 'global.json'
      - '.gitmodules'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: windows

  release-zip:
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows-desktop
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  build-aot:
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      isAot: true

  release-aot-zip:
    if: inputs.release_tag != ''
    needs: build-aot
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows-desktop
      release_tag: ${{ inputs.release_tag }}
      isAot: true
    secrets: inherit

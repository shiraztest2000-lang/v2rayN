name: Remove defective 7.25.6.009 package before rebuilding

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/remove-bad-package-009.yml'

permissions:
  contents: write

jobs:
  remove-defective-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete defective release and its tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete 7.25.6.009 --repo "$REPOSITORY" --cleanup-tag --yes
          echo "Deleted defective release 7.25.6.009 and its tag."
